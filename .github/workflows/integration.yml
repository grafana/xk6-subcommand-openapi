# Integration test against a real k6 binary. The shared grafana/k6-ci workflow only runs Go-level checks,
# so this job builds k6 with the extension via xk6 and runs `make it`, the same target used locally.
# Neither xk6 nor k6 is pinned: the latest xk6 builds the extension with the latest k6 release.
name: integration
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.go-versions.outputs.current }}
    steps:
      # Same SHA as the k6-ci ref in all.yml, so this job uses the Go version the k6-ci jobs test with.
      - name: Resolve Go versions
        id: go-versions
        uses: grafana/k6-ci/.github/actions/go-versions@bc53c239916ae45b50a0bdea2a37698589219c84 # v0.5.3

  integration:
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ needs.configure.outputs.current }}
          cache: false # against cache-poisoning
          check-latest: true

      - name: Install xk6
        # Pinned to main: v1.1.1 references actions/cache by tag, which the org policy rejects; main pins it by SHA.
        uses: grafana/setup-xk6@157bf50488ea3a572d5d504b6088e0ea6507059c # main (v1.1.1 + SHA-pinned actions/cache)
        with:
          xk6-version: latest

      - name: Integration test
        run: make it
