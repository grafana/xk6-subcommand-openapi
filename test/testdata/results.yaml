# Method result: one variant per documented response and one for status 0, told apart by status; explicit codes
# as number literals, ranges as HttpStatus1XX to HttpStatus5XX or, with explicit codes in the range, as a
# per-method type such as UpdatePetStatus4XX, and default as HttpStatusAll or, next to other responses, as a
# per-method type such as GetPetStatusDefault; default next to a range excludes the range; range keys compared
# case-insensitively; several success responses; undefined for a response without content; the union over a
# response's media types, with the schema type for application/json and +json media types, unknown for JSON
# without a schema, and Response["body"] for other media types; only a default response; no documented failure;
# no documented response at all; invalid responses keys skipped with a warning; a component schema named
# HttpStatusAll, a reserved name, renamed with a numeric suffix and a warning; inline response schemas named
# after the method and the status.
openapi: 3.0.3
info:
  title: Results
  version: 1.0.0
paths:
  /pets/{petId}:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getPet
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFound" }
        default:
          description: error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: updatePet
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "202":
          description: accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "204": { description: unchanged }
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFound" }
        4XX:
          description: client error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: deletePet
      responses:
        2XX: { description: deleted }
        "409":
          description: conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason: { type: string }
  /pets/{petId}/photo:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getPhoto
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
            text/plain:
              schema: { type: string }
            image/png: {}
        "400":
          description: bad request
          content:
            application/json: {}
  /pets:
    get:
      operationId: listPets
      responses:
        default:
          description: pets or an error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
    post:
      operationId: createPet
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
  /pets/search:
    get:
      operationId: searchPets
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        20X: { description: not a status code }
        "600": { description: not a status code }
  /jobs:
    get:
      operationId: getJob
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        5xx:
          description: server error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HttpStatusAll" }
  /ping:
    get:
      operationId: ping
      responses: {}
components:
  schemas:
    Pet:
      type: object
      properties:
        name: { type: string }
    Job:
      type: object
      properties:
        id: { type: string }
    NotFound:
      type: object
      properties:
        message: { type: string }
    Error:
      type: object
      properties:
        code: { type: integer }
    Problem:
      type: object
      properties:
        title: { type: string }
    HttpStatusAll:
      type: object
      properties:
        healthy: { type: boolean }
