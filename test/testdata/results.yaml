# Method result: Result types with a success and a failure variant; success data from 2XX and the status codes
# 200 to 299, failure data from all other responses including 4XX and default; undefined for a response without
# content, also more than once; the union over a response's media types, with the schema type for application/json
# and +json media types, unknown for JSON without a schema, and Response["body"] for other media types;
# only a default response on both sides; unknown for no documented failure and for no documented response at all;
# inline response schemas named after the method and the status.
openapi: 3.0.3
info:
  title: Results
  version: 1.0.0
paths:
  /pets/{petId}:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getPet
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotFound" }
        default:
          description: error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: updatePet
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "202":
          description: accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "204": { description: unchanged }
        "205": { description: reset }
        4XX:
          description: client error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { description: server error }
    delete:
      operationId: deletePet
      responses:
        2XX: { description: deleted }
        "409":
          description: conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason: { type: string }
  /pets/{petId}/photo:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getPhoto
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
            text/plain:
              schema: { type: string }
            image/png: {}
        "400":
          description: bad request
          content:
            application/json: {}
  /pets:
    get:
      operationId: listPets
      responses:
        default:
          description: pets or an error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
    post:
      operationId: createPet
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
  /ping:
    get:
      operationId: ping
      responses: {}
components:
  schemas:
    Pet:
      type: object
      properties:
        name: { type: string }
    Job:
      type: object
      properties:
        id: { type: string }
    NotFound:
      type: object
      properties:
        message: { type: string }
    Error:
      type: object
      properties:
        code: { type: integer }
    Problem:
      type: object
      properties:
        title: { type: string }
